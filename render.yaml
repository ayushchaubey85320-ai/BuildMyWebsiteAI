services:
  # FastAPI Backend Service on Render
  - type: web
    name: buildmywebsiteai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt gunicorn uvicorn
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./buildmywebsiteai_fallback.db
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # React Vite Static Frontend on Render
  - type: web
    name: buildmywebsiteai-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: buildmywebsiteai-backend
          property: url
