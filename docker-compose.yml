version: '3.8'

services:
  backend:
    build: ./backend
    container_name: buildmywebsiteai_backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./buildmywebsiteai_fallback.db}
      - JWT_SECRET=${JWT_SECRET:-prod_super_secret_jwt_key_buildmywebsiteai_2026}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: buildmywebsiteai_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
